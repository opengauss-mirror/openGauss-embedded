name: openGauss-embedded 全平台编译 CI

on:
  push:
    branches:
      - master
      - add_pipeline_workflow
  pull_request:
    branches:
      - master

jobs:
  # ==============================================
  # 1. Linux x86_64 编译
  # ==============================================
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt install -y gcc make cmake git libssl-dev libaio-dev
      - name: Build release
        run: make release

  # ==============================================
  # 2. Linux ARM64 编译
  # ==============================================
  build-linux-arm64:
    name: Linux ARM64
    runs-on: arm64-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt install -y gcc make cmake git libssl-dev libaio-dev
      - name: Build release
        run: make release

  # ==============================================
  # 3. openEuler x86_64 编译
  # ==============================================
  build-openeuler-x86_64:
    name: openEuler x86_64
    runs-on: euleros-2.10.1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo yum install -y gcc gcc-c++ make cmake git openssl-devel libaio-devel
      - name: Build release
        run: make release

  # ==============================================
  # 4. openEuler ARM64 编译
  # ==============================================
  build-openeuler-arm64:
    name: openEuler ARM64
    runs-on: arm64-euleros-2.10.1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo yum install -y gcc gcc-c++ make cmake git openssl-devel libaio-devel
      - name: Build release
        run: make release

  # ==============================================
  # 5. Windows x86_64 编译
  # ==============================================
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create build dir
        run: mkdir build
      - name: CMake Generate
        run: cmake -B build
      - name: Build Release
        run: cmake --build build --config Release
